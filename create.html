<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/MiSheng-logo-w.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>即時轉化｜謎生 Misheng</title>

    <!-- 深色模式的底色必須在**第一次繪製之前**就定下來，否則重整時會先閃一格白畫面。
         而那一閃正好發生在使用者最沒有防備的時候，也就是當初要做深色模式的理由本身。

         為什麼非得寫在這裡，不能靠 JS 或 create.css：
           1. MUI 的 InitColorSchemeScript 是給 SSR 用的——它要把 script 寫進「伺服器送出的
              HTML」。這個專案是純 CSR 的 Vite，script 由 React 掛載後才插入，那時白色已經畫
              過了（而且 React 插入的 <script> 本來就不會執行）。
           2. create.css 是被 createMain.jsx import 的，dev 模式下由 JS 注入，一樣太晚。
              build 之後才會變成 <head> 裡的 <link>——只有 production 不閃，是最糟的那種 bug。
         所以只剩「行內、阻塞、在 head」這一條路。

         代價是這兩個色值在 theme.js 之外多了一份複本。改 theme.js 的 background.default
         時這裡要一起改——這是為了不閃而付的錢，沒有更便宜的付法。 -->
    <style>
      html { background: #fff; }
      /* 兜底：無痕視窗或封鎖 storage 時底下的 script 會走 catch，什麼屬性都沒設。
         沒有這條的話，系統是深色的人照樣會吃到白底——也就是這次要修的那個閃。
         :not([data-light]) 讓「明確選了淺色」仍然贏過系統設定。 */
      @media (prefers-color-scheme: dark) {
        html:not([data-light]) { background: #1c2429; }
      }
      html[data-dark] { background: #1c2429; }
    </style>
    <script>
      // 與 MUI 的 useColorScheme 共用同一個 localStorage key 與同一組屬性名
      // （colorSchemeSelector: 'data' ⇒ data-light / data-dark）。
      // 這裡只搶先算一次，算完 MUI 接手，兩邊結論一致所以不會打架。
      (function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(dark ? 'data-dark' : 'data-light', '');
        } catch (e) {
          // 無痕視窗或封鎖 storage 時讀不到。什麼都不設是對的：上面那條
          // @media (prefers-color-scheme: dark) 會接手，結果仍然跟系統一致。
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/createMain.jsx"></script>
  </body>
</html>
